name: Stage Frontend CD

on:
  pull_request:
    branches: [stage]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: stage-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy merged PR artifact to staging
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      ARTIFACT_NAME: frontend-stage-${{ github.event.pull_request.head.sha }}

    steps:
      - name: Verify deployment configuration
        env:
          AWS_STAGE_CD_ROLE_ARN: ${{ vars.AWS_STAGE_CD_ROLE_ARN }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          required=(
            AWS_REGION AWS_STAGE_CD_ROLE_ARN AWS_ACCOUNT_ID
            S3_BUCKET_NAME CLOUDFRONT_DISTRIBUTION_ID FRONTEND_URL
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required staging Environment variable: ${name}"
              exit 1
            fi
          done
          if [[ ! "${PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid PR head SHA: ${PR_HEAD_SHA}"
            exit 1
          fi

      - name: Find successful CI run containing the exact SHA artifact
        id: ci-run
        uses: actions/github-script@v7
        with:
          script: |
            const workflowId = "stage-ci.yml";
            const artifactName = process.env.ARTIFACT_NAME;
            const headSha = process.env.PR_HEAD_SHA;
            const pullNumber = context.payload.pull_request.number;
            const maxAttempts = 60;
            const retryDelayMs = 15_000;

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                event: "pull_request",
                per_page: 100,
              });
              const runs = response.data.workflow_runs;

              const matchingRuns = runs
                .filter(
                  (run) =>
                    run.head_sha === headSha &&
                    run.conclusion === "success",
                )
                .sort((left, right) => right.run_attempt - left.run_attempt || right.id - left.id);

              for (const run of matchingRuns) {
                const artifactResponse = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                });
                const artifacts = artifactResponse.data.artifacts;
                const exactArtifact = artifacts.find(
                  (artifact) => artifact.name === artifactName && !artifact.expired,
                );
                if (exactArtifact) {
                  core.setOutput("run-id", String(run.id));
                  core.info(`Using ${artifactName} from successful run ${run.id}`);
                  return;
                }
              }

              if (attempt < maxAttempts) {
                core.info(
                  `Waiting for ${artifactName} from ${workflowId} ` +
                    `(attempt ${attempt}/${maxAttempts})`,
                );
                await new Promise((resolve) => setTimeout(resolve, retryDelayMs));
              }
            }

            core.setFailed(
              `Timed out waiting for successful ${workflowId} run for PR #${pullNumber} ` +
                `containing ${artifactName}`,
            );

      - name: Download exact staging artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
          run-id: ${{ steps.ci-run.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifact contents
        run: test -f dist/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STAGE_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Upload immutable assets
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET_NAME}/" \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload uncached index
        run: |
          aws s3 cp dist/index.html "s3://${S3_BUCKET_NAME}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate and wait for index.html
        run: |
          set -euo pipefail
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths /index.html \
            --query Invalidation.Id \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${invalidation_id}"

      - name: Smoke check staging frontend
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 10 --retry-all-errors --retry-delay 10 \
            --max-time 15 \
            "${FRONTEND_URL}/"
