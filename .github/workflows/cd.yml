name: V1 Frontend CD (dev to cosmoscode.site)

on:
  workflow_run:
    workflows: ["Frontend (React) CI Pipeline"]
    branches: [dev]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: v1-frontend-apex-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy dev artifact to cosmoscode.site
    if: >-
      ${{
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'dev' &&
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      ARTIFACT_NAME: frontend-v1-${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Verify deployment configuration
        env:
          AWS_STAGE_CD_ROLE_ARN: ${{ vars.AWS_STAGE_CD_ROLE_ARN }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          required=(
            AWS_REGION AWS_STAGE_CD_ROLE_ARN AWS_ACCOUNT_ID
            S3_BUCKET_NAME CLOUDFRONT_DISTRIBUTION_ID FRONTEND_URL ARTIFACT_NAME
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required V1 apex deployment setting: ${name}"
              exit 1
            fi
          done

      - name: Download exact dev artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifact contents
        run: test -f dist/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STAGE_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Upload immutable assets
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET_NAME}/" \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload uncached index
        run: |
          aws s3 cp dist/index.html "s3://${S3_BUCKET_NAME}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Invalidate and wait for index.html
        run: |
          set -euo pipefail
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths /index.html / \
            --query Invalidation.Id \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${invalidation_id}"

      - name: Smoke check V1 apex frontend
        run: |
          curl --fail --show-error --silent \
            --retry 10 --retry-all-errors --retry-delay 10 \
            --max-time 15 \
            "${FRONTEND_URL}/"
