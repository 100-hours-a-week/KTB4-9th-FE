name: Frontend CD Pipeline (S3 + CloudFront)

on:
  workflow_run:
    workflows: ["Frontend (React) CI Pipeline"]
    branches: [dev]
    types: [ completed ]

permissions:
  actions: read
  contents: read

concurrency:
  group: frontend-cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Deploy to S3 & Invalidate CDN
    if: >-
      ${{
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'dev' &&
        github.event.workflow_run.conclusion == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download frontend artifact from CI
        uses: actions/download-artifact@v4
        with:
          name: frontend-v1-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/frontend-dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # 2. AWS 인증 (us-west-2 리전)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # 3. [1단계] 정적 애셋(JS/CSS/이미지) 선행 업로드 (1달 캐싱, 무중단 보장)
      - name: Upload Static Assets to S3
        run: |
          aws s3 sync "${RUNNER_TEMP}/frontend-dist/" s3://${{ vars.S3_BUCKET_NAME }}/ \
            --exclude "index.html" \
            --cache-control "public, max-age=2592000, immutable"

      # 4. [2단계] index.html 업로드 (새 버전 스위치 전환)
      - name: Upload index.html to S3
        run: |
          aws s3 cp "${RUNNER_TEMP}/frontend-dist/index.html" s3://${{ vars.S3_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      # 5. [3단계] CloudFront 캐시 무효화 (/index.html 즉시 갱신)
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html"
