name: Frontend (React) CI Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate-frontend:
    name: React Lint & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (Strict)
        run: npm ci

      # 1. ESLint 정적 분석 검사
      - name: Run ESLint
        run: npm run lint

      - name: Verify pull request build
        if: github.event_name == 'pull_request'
        env:
          VITE_API_BASE_URL: https://api.example.com
        run: npm run build

      - name: Verify V1 development deployment configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_USE_MOCKS: ${{ vars.VITE_USE_MOCKS || 'false' }}
          VITE_KAKAO_REDIRECT_URI: ${{ vars.KAKAO_REDIRECT_URI }}
        run: |
          set -euo pipefail
          if [[ "${VITE_API_BASE_URL}" != "https://dev.cosmoscode.site/api" ]]; then
            echo "::error::VITE_API_BASE_URL must target the V1 development API"
            exit 1
          fi
          if [[ "${VITE_KAKAO_REDIRECT_URI}" != "https://dev.cosmoscode.site/api/auth/oauth/kakao/callback" ]]; then
            echo "::error::VITE_KAKAO_REDIRECT_URI must target the V1 development callback"
            exit 1
          fi
          if [[ "${VITE_USE_MOCKS}" != "false" ]]; then
            echo "::error::VITE_USE_MOCKS must be false for the V1 development deployment"
            exit 1
          fi

      - name: Build V1 deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_USE_MOCKS: ${{ vars.VITE_USE_MOCKS || 'false' }}
          VITE_KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY || vars.KAKAO_REST_API_KEY }}
          VITE_KAKAO_REDIRECT_URI: ${{ vars.KAKAO_REDIRECT_URI }}
          VITE_CLARITY_PROJECT_ID: ${{ vars.VITE_CLARITY_PROJECT_ID }}
        run: npm run build

      - name: Upload V1 deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-v1-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
