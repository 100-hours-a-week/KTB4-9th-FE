name: Stage Frontend CI

on:
  pull_request:
    branches: [stage]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: frontend-stage-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  artifact:
    name: Build staging artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging-ci
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_USE_MOCKS: ${{ vars.VITE_USE_MOCKS }}
      VITE_KAKAO_REST_API_KEY: ${{ vars.VITE_KAKAO_REST_API_KEY }}
      VITE_KAKAO_REDIRECT_URI: ${{ vars.VITE_KAKAO_REDIRECT_URI }}
      VITE_CLARITY_PROJECT_ID: ${{ vars.VITE_CLARITY_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify staging configuration
        run: |
          set -euo pipefail
          required=(
            VITE_API_BASE_URL VITE_USE_MOCKS VITE_KAKAO_REST_API_KEY
            VITE_KAKAO_REDIRECT_URI VITE_CLARITY_PROJECT_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required staging Environment variable: ${name}"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build staging application
        run: npm run build

      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-stage-${{ env.PR_HEAD_SHA }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
